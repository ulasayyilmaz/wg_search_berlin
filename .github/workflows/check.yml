name: Check WG-Gesucht

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may start runs a few minutes late)
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # to commit seen.json back

concurrency:
  group: wg-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new offers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_FILE: status.json
          DECISIONS_FILE: decisions.json
        run: python wg_checker.py --once

      - name: Save seen ads
        run: |
          git config user.name "wg-checker"
          git config user.email "wg-checker@users.noreply.github.com"
          git add seen.json status.json decisions.json
          git diff --cached --quiet && exit 0
          git commit -m "Update seen ads"
          # the repo may have moved on during the run (e.g. a code push): rebase and retry,
          # keeping this run's state files on conflict
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 5
          done
          exit 1
